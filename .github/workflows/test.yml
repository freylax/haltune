name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install Python dependencies
      run: |
        pip install -r tests/requirements.txt

    - name: Build
      run: zig build

    - name: Run tests
      run: |
        cd tests
        pytest -v
